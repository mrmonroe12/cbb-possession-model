[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cbb-possession-model"
version = "0.1.0"
description = "Deep learning model for predicting college basketball possession outcomes"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pandas>=2.0",
    "polars>=0.20",
    "pyarrow>=14.0",
    "numpy>=1.24",
    "google-cloud-bigquery>=3.0",
    "torch>=2.0",
    "scikit-learn>=1.3",
    "tqdm",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "jupyter",
    "matplotlib",
    "seaborn",
]

[tool.setuptools]
packages = ["src", "src.data", "src.model", "src.training", "src.evaluation"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
